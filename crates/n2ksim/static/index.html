<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n2ksim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23fff%22/%3E%3Cpath d=%22M1 7h14M4 7v6M8 7v6M12 7v6%22 stroke=%22%23000%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
<style>
:root {
  --paper: #ffffff;
  --ink: #000000;
  --rule: #dadada;
  --ink2: #767676;
  --wash: #f2f2f2;
  --sans: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --din: "DIN Alternate", "DIN Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* Function colours: used as swatches and lights, never for text. */
  --blue: #2f5be0;
  --green: #1f9d55;
  --yellow: #f5c400;
  --orange: #ff5a1f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.din { font-family: var(--din); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink2); }
a { color: var(--ink); }

/* Title block */
#app { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh; }
.tb { display: flex; min-width: 0; align-items: stretch; border-bottom: 2px solid var(--ink); overflow-x: auto; white-space: nowrap; scrollbar-width: thin; }
.tb > * { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-right: 1px solid var(--ink); flex: none; }
.tb .name { font-family: var(--din); font-size: 20px; letter-spacing: .02em; padding-right: 16px; }
.tb .cell small { color: var(--ink2); font-size: 11px; display: block; line-height: 1.1; }
.tb .cell b { font-family: var(--din); font-weight: normal; font-size: 16px; display: block; line-height: 1.2; }
.tb .cell > div { display: flex; flex-direction: column; }
.tb .grow { flex: 1; border-right: 0; padding: 0; }
.tb .end { border-right: 0; border-left: 1px solid var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg button { background: var(--paper); border: 0; padding: 3px 9px; cursor: pointer; font-family: var(--din); }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); }
#meter { display: block; }
#meter .needle { transition: transform .4s ease-out; transform-origin: 40px 38px; }
.btn { background: var(--paper); border: 1px solid var(--ink); border-bottom-width: 2.5px; border-radius: 5px; padding: 4px 11px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:active { transform: translateY(1px); border-bottom-width: 1.5px; }
.btn.solid { background: var(--orange); color: var(--ink); }
.btn.solid:hover { background: var(--ink); color: var(--orange); }
.btn.small { padding: 2px 8px; font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; flex: none; }
.dot.on { background: var(--green); }
.dot.alarm { background: var(--orange); }
.sw { display: inline-block; width: 9px; height: 9px; border: 1px solid var(--ink); margin-right: 5px; vertical-align: -1px; flex: none; }
.sw.motion { background: var(--blue); } .sw.air { background: var(--green); } .sw.nav { background: var(--yellow); } .sw.helm { background: var(--ink); } .sw.mgmt { background: var(--paper); }
.ico { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

nav.tabs { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--ink); flex-wrap: wrap; }
nav.tabs button { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 5px 11px 4px; cursor: pointer; color: var(--ink); }
nav.tabs button:active { transform: translateY(1.5px); border-bottom-width: 1.5px; }
nav.tabs button.on { background: var(--ink); color: var(--paper); }
nav.tabs .kbd { font-family: var(--din); font-size: 11px; line-height: 1; border: 1px solid currentColor; border-radius: 3px; padding: 2px 4px 1px; opacity: .7; }
#offline { display: none; background: var(--ink); color: var(--paper); padding: 6px 16px; }
main { overflow: auto; min-height: 0; }
.view { display: none; padding: 16px 20px 40px; max-width: 1500px; }
.view.on { display: block; }

/* Sheets */
.sheet { border: 1.5px solid var(--ink); margin-bottom: 18px; background: var(--paper); }
.sheet > h2 { margin: 0; padding: 7px 12px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--ink); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sheet > h2 .grow { flex: 1; }
.sheet > .body { padding: 12px; }
.paper { background-image: radial-gradient(var(--rule) 1px, transparent 1.2px); background-size: 19px 19px; background-position: 9px 9px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; }
label.f { display: inline-flex; flex-direction: column; gap: 2px; color: var(--ink2); font-size: 12px; }
label.f input, label.f select, .field { border: 0; border-bottom: 1px solid var(--ink); background: transparent; padding: 3px 1px; width: 96px; font-family: var(--din); font-size: 15px; color: var(--ink); border-radius: 0; }
label.f input[type=text] { width: 180px; font-family: var(--sans); font-size: 14px; }
label.c { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
input[type=checkbox], input[type=range] { accent-color: var(--ink); }
select.btn { padding: 3px 6px; }
fieldset { border: 0; border-top: 1px solid var(--ink); margin: 14px 0 0; padding: 10px 0 0; }
legend { padding: 0 6px 0 0; font-size: 13px; font-weight: 600; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--ink); position: sticky; top: 0; background: var(--paper); white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--din); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--wash); }
tr.sel td { background: var(--ink); color: var(--paper); }
tr.sel td .muted { color: var(--rule); }
.clip { max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scroll { overflow: auto; }

/* Schematic */
#sheet-svg { display: block; user-select: none; touch-action: pan-x pan-y; }
#sheet-svg .dev, #sheet-svg .term { touch-action: none; }
.sheetbox { position: relative; overflow-x: auto; overflow-y: hidden; }
#sheet-svg text { font-family: var(--sans); fill: var(--ink); }
#sheet-svg .din { font-family: var(--din); }
#sheet-svg .dev { cursor: grab; }
#sheet-svg .dev:active { cursor: grabbing; }
#sheet-svg .term { cursor: pointer; }
@media (prefers-reduced-motion: reduce) { #meter .needle { transition: none; } }

/* Test drawer */
#testtab { position: fixed; right: 0; top: 46%; transform: translateY(-50%); writing-mode: vertical-rl; background: var(--ink); color: var(--paper); border: 0; padding: 14px 7px; cursor: pointer; font-family: var(--din); font-size: 16px; letter-spacing: .04em; z-index: 6; display: flex; align-items: center; gap: 8px; }
#testtab .count { writing-mode: horizontal-tb; background: var(--orange); color: var(--ink); min-width: 20px; padding: 1px 4px; text-align: center; font-size: 13px; }
#testtab .count:empty { display: none; }
#test { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--paper); border-left: 2px solid var(--ink); transform: translateX(100%); transition: transform .22s ease-out; z-index: 7; display: grid; grid-template-rows: auto 1fr; box-shadow: -8px 0 0 rgba(0,0,0,.06); }
#test.open { transform: none; }
@media (prefers-reduced-motion: reduce) { #test { transition: none; } }
#test header { display: flex; align-items: center; padding: 10px 14px; border-bottom: 2px solid var(--ink); gap: 10px; }
#test header b { font-family: var(--din); font-weight: normal; font-size: 20px; flex: 1; }
#test .inner { overflow: auto; padding: 4px 0 30px; }
.find { border-bottom: 1px solid var(--rule); padding: 9px 14px; cursor: pointer; display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: start; }
.find .mark { width: 12px; height: 12px; border: 1.5px solid var(--ink); margin-top: 4px; }
.find.error .mark { background: var(--orange); }
.find.warn .mark { background: var(--yellow); }
.find.info .mark { border-radius: 50%; }
.find .d { display: none; grid-column: 2 / 4; color: var(--ink2); font-size: 13px; }
.find.open .d { display: block; }
.find .ev { font-size: 11px; color: var(--ink2); border: 1px solid var(--rule); padding: 0 5px; white-space: nowrap; }
.allgood { padding: 14px; }
.subhead { padding: 18px 14px 6px; font-weight: 600; border-bottom: 1px solid var(--ink); }
.drill { display: block; width: 100%; text-align: left; background: var(--paper); border: 0; border-bottom: 1px solid var(--rule); padding: 9px 14px; cursor: pointer; }
.drill:hover { background: var(--ink); color: var(--paper); }
.drill:hover span { color: var(--rule); }
.drill span { display: block; color: var(--ink2); font-size: 13px; }

/* Instruments */
.faces { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.face { border: 1.5px solid var(--ink); border-radius: 6px; padding: 12px 12px 9px; position: relative; min-height: 132px; display: flex; flex-direction: column; }
.face::before { content: ""; position: absolute; left: 12px; top: -1.5px; width: 34px; height: 5px; background: var(--cat, var(--ink)); border: 1px solid var(--ink); border-top: 0; }
.face .k .ico { margin-right: 6px; vertical-align: -3px; }
.face .k { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; font-weight: 600; font-size: 13px; }
.face .k span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.face .k select { border: 0; background: transparent; font-size: 11px; color: var(--ink2); width: 62px; flex: none; text-align: right; }
.face .v { font-family: var(--din); font-size: 34px; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.face .v small { font-size: 15px; margin-left: 3px; color: var(--ink2); }
.face .s { margin-top: auto; padding-top: 4px; font-size: 12px; color: var(--ink2); display: flex; justify-content: space-between; gap: 8px; }
.face .s span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.face.big { grid-row: span 2; }
.face.stale .v { text-decoration: line-through; color: var(--ink2); }
.face.stale::after { content: "stale"; position: absolute; top: 8px; right: 10px; background: var(--orange); color: var(--ink); font-size: 11px; padding: 0 5px; }
.face .body svg { display: block; margin: 6px auto 0; }
.diff { font-weight: 700; background: var(--orange); color: var(--ink); padding: 0 4px; }

/* Traffic */
.log td { padding: 2px 6px; white-space: nowrap; border-bottom: 1px solid var(--wash); font-family: var(--mono); font-size: 12px; }
.log td.txt { max-width: 0; overflow: hidden; text-overflow: ellipsis; width: 100%; font-family: var(--sans); font-size: 13px; }
.log tr.err td { text-decoration: line-through; }
.log tr .src-cli { border-left: 3px solid var(--ink); }
.log tr .src-con { border-left: 3px double var(--ink); }
.log tr .src-rep { border-left: 3px dotted var(--ink); }
.detail { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; border: 1px solid var(--ink); padding: 8px; min-height: 56px; background: var(--wash); }
canvas.chart { width: 100%; height: 110px; display: block; }
pre.help { font-family: var(--mono); font-size: 12px; border: 1px solid var(--ink); padding: 8px 10px; overflow: auto; margin: 6px 0; background: var(--wash); }
code { font-family: var(--mono); font-size: 12px; background: var(--wash); padding: 0 3px; }

#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; display: none; z-index: 10; max-width: 90vw; }
#toast.err { background: var(--orange); color: var(--ink); border: 2px solid var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--ink); border-bottom-width: 2px; border-radius: 12px; padding: 1px 9px; background: var(--paper); cursor: pointer; font-size: 12px; }
.chip.off { opacity: .35; }
.pulses { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }

@media (max-width: 760px) {
  .view { padding: 12px; }
  .cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <div>
    <div id="offline">Lost connection to the simulator. Retrying.</div>
    <header class="tb" id="tb">
      <div class="name">n2ksim</div>
      <div class="cell"><div><small>Network</small><b id="netname">…</b></div></div>
      <div class="cell"><div><small>UTC</small><b id="clock">--:--:--</b></div></div>
      <div><span class="seg" id="speed"></span></div>
      <div class="cell" title="Share of the last second the bus was busy">
        <svg id="meter" width="80" height="44" viewBox="0 0 80 44" aria-hidden="true"></svg>
        <div><small>Bus load</small><b id="loadtxt">0%</b></div>
      </div>
      <div class="cell"><div><small>Frames per second</small><b id="fps">0</b></div></div>
      <div class="cell"><div><small>Error frames per second</small><b id="eps">0</b></div></div>
      <div class="cell" id="gw"></div>
      <div class="cell" id="replaycell" style="display:none"><div><small>Replay</small><b id="replay"></b></div></div>
      <div class="grow"></div>
      <div class="end"><button class="btn" id="savebtn" title="Save the network and conditions to the config file">Save</button></div>
    </header>
  </div>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-tab="network" class="on"><svg class="ico" viewBox="0 0 16 16"><path d="M1 6h14M4 6v6M8 6v6M12 6v6"/><rect x="2.5" y="12" width="3" height="2.5"/><rect x="10.5" y="12" width="3" height="2.5"/></svg>Network<span class="kbd">1</span></button>
    <button data-tab="instruments" title="Decoded from frames on the bus, as a display would show it"><svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M8 8l3-3"/><circle cx="8" cy="8" r="1" fill="currentColor"/></svg>Instruments<span class="kbd">2</span></button>
    <button data-tab="traffic"><svg class="ico" viewBox="0 0 16 16"><path d="M1 9h2l1.5-5 2.5 9 2-7 1.5 3H15"/></svg>Traffic<span class="kbd">3</span></button>
    <button data-tab="sailing"><svg class="ico" viewBox="0 0 16 16"><path d="M7 1.5v11.5M7 2l6 10H7M7 4L3 12h4M2 14.5h12"/></svg>Sailing<span class="kbd">4</span></button>
  </nav>
  <main>
    <div class="view on" id="v-network"></div>
    <div class="view" id="v-instruments"></div>
    <div class="view" id="v-traffic"></div>
    <div class="view" id="v-sailing"></div>
  </main>
</div>
<button id="testtab" aria-controls="test" aria-expanded="false" title="Test (T)">Test <span class="count" id="testcount"></span></button>
<aside id="test" aria-label="Test">
  <header><b>Test</b><button class="btn small" id="testclose">Close</button></header>
  <div class="inner">
    <div id="checks"></div>
    <div class="subhead">Break something</div>
    <div id="drills"></div>
    <div class="row" style="padding:12px 14px">
      <button class="btn" id="clearfaults">Clear faults</button>
      <button class="btn" id="powercycle" title="Switch everything off and on again; clears the analyser">Power cycle</button>
    </div>
  </div>
</aside>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DEG = 180 / Math.PI, KN = 3600 / 1852;
const fix = (x, n = 1) => (x == null || !isFinite(x)) ? "–" : Number(x).toFixed(n);
const wrap180 = a => { a = ((a + 180) % 360 + 360) % 360 - 180; return a === -180 ? 180 : a; };
const wrap360 = a => ((a % 360) + 360) % 360;

let S = null, META = { kinds: [], drills: [], presets: [], pgn_defs: [], library: [], variants: {}, networks: [] };
const UI = { tab: "network", device: null, sources: {}, logMode: "msgs", logPaused: false, filter: "", errorsOnly: false, pgnSel: null, openChecks: new Set(), track: [], truthTrack: [], depthHist: [], active: new Map() };
const FRAMES = [], MSGS = [];
const PGN_NAMES = {};
const RM = matchMedia("(prefers-reduced-motion: reduce)");

/* Each PGN belongs to one function, and each function has one colour. */
const CATS = [
  ["motion", "Heading and motion", "#2f5be0"],
  ["air", "Wind, air and sea", "#1f9d55"],
  ["nav", "Position, speed and depth", "#f5c400"],
  ["helm", "Steering and power", "#000000"],
  ["mgmt", "Network management", "#ffffff"],
];
const CATCOL = Object.fromEntries(CATS.map(c => [c[0], c[2]]));
function pgnCat(p) {
  if ([127250, 127251, 127252, 127257, 127258].includes(p)) return "motion";
  if (p === 130306 || (p >= 130310 && p <= 130316) || p === 130323) return "air";
  if ([126992, 128000, 128259, 128267, 128275, 129025, 129026, 129029, 129033, 129283, 129284, 129291, 129539, 129540, 130577, 130578].includes(p)) return "nav";
  if ([127245, 127237, 127501, 127505, 127506, 127508, 127513, 127751].includes(p)) return "helm";
  return "mgmt";
}
const sw = p => `<span class="sw ${pgnCat(p)}" aria-hidden="true"></span>`;
const ICONS = {
  heading: '<circle cx="8" cy="8" r="6.5"/><path d="M8 3.5l1.6 4.5H6.4z" fill="currentColor"/>',
  wind: '<path d="M1.5 5h8a2 2 0 1 0-2-2M1.5 8.5h11a2 2 0 1 1-2 2M1.5 12h6"/>',
  speed: '<path d="M2 11a6 6 0 0 1 12 0"/><path d="M8 11l3-4"/>',
  sog: '<path d="M2 13L13 3M8 3h5v5"/><path d="M1.5 14.5h13" stroke-dasharray="1.5 1.5"/>',
  depth: '<path d="M1 4c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0"/><path d="M8 7v7M5.5 11.5L8 14l2.5-2.5"/>',
  rudder: '<path d="M8 1.5v5"/><path d="M6 6.5h4l-.5 8h-3z"/>',
  heel: '<path d="M2 13h12"/><path d="M4 10l9-4 0 4z"/><path d="M8.5 8V2"/>',
  rot: '<path d="M13 8a5 5 0 1 1-2-4"/><path d="M11 1.5V4.5H14"/>',
  pos: '<circle cx="8" cy="8" r="4.5"/><path d="M8 1v3.5M8 11.5V15M1 8h3.5M11.5 8H15"/>',
  temp: '<path d="M6.5 2.5a1.5 1.5 0 0 1 3 0v7a3 3 0 1 1-3 0z"/>',
  battery: '<rect x="1.5" y="4.5" width="12" height="7" rx="1"/><path d="M15 7v2M4 8h3M5.5 6.5v3"/>',
  log: '<rect x="1.5" y="4.5" width="13" height="7"/><path d="M5 4.5v7M8 4.5v7M11 4.5v7"/>',
};
const icon = k => `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">${ICONS[k] || ""}</svg>`;

function toast(msg, ok) {
  const t = $("#toast"); t.textContent = msg; t.className = ok ? "" : "err"; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 3500);
}
async function api(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
    const j = await r.json();
    if (!j.ok) toast(j.error || "The simulator refused that change");
    return j;
  } catch { toast("Could not reach the simulator"); return { ok: false }; }
}
function setPath(path, value) {
  const o = {}; let cur = o; const parts = path.split(".");
  parts.forEach((p, i) => { if (i === parts.length - 1) cur[p] = value; else cur = cur[p] = {}; });
  return o;
}
function getPath(obj, path) { return path.split(".").reduce((o, k) => o?.[k], obj); }
function syncInput(inp, v) {
  if (document.activeElement === inp) return;
  if (inp.type === "checkbox") inp.checked = !!v;
  else if (inp.tagName === "SELECT") { if (inp.value !== String(v)) inp.value = v; }
  else { const s = (typeof v === "number") ? String(+v.toFixed(4)) : (v ?? ""); if (inp.value !== s) inp.value = s; }
}
function readInput(inp) {
  if (inp.type === "checkbox") return inp.checked;
  if (inp.type === "number" || inp.type === "range") { const n = parseFloat(inp.value); return isFinite(n) ? n : 0; }
  return inp.value;
}

/* ---------- live data ---------- */
function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => $("#offline").style.display = "none";
  es.onerror = () => { $("#offline").style.display = "block"; };
  es.onmessage = e => {
    const d = JSON.parse(e.data);

/* Moving-coil meter for bus load; hatched band from 40%. */
function buildMeter() {
  const cx = 40, cy = 38, r = 30;
  let ticks = "";
  for (let i = 0; i <= 10; i++) {
    const a = Math.PI * (1 - i / 10), big = i % 5 === 0, r2 = big ? r - 7 : r - 4;
    ticks += `<line x1="${cx + Math.cos(a) * r2}" y1="${cy - Math.sin(a) * r2}" x2="${cx + Math.cos(a) * r}" y2="${cy - Math.sin(a) * r}" stroke="#000" stroke-width="${big ? 1.5 : 1}"/>`;
  }
  const arc = (f0, f1, rr) => { const a0 = Math.PI * (1 - f0), a1 = Math.PI * (1 - f1); return `M${cx + Math.cos(a0) * rr} ${cy - Math.sin(a0) * rr} A${rr} ${rr} 0 0 1 ${cx + Math.cos(a1) * rr} ${cy - Math.sin(a1) * rr}`; };
  $("#meter").innerHTML = `<rect x="1" y="1" width="78" height="42" rx="3" fill="#fff" stroke="#000"/>
    <path d="${arc(0, 1, r)}" fill="none" stroke="#000"/>
    <path d="${arc(0.4, 1, r - 3)}" fill="none" stroke="#ff5a1f" stroke-width="5"/>
    ${ticks}
    <g class="needle"><line x1="${cx}" y1="${cy}" x2="${cx - r + 3}" y2="${cy}" stroke="#000" stroke-width="1.4"/></g>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#000"/>`;
}

      return `<rect x="0" y="${H * .3}" width="${W * .06}" height="${H * .4}" ${k}/>
        <rect x="${W * .05}" y="${H * .15}" width="${body}" height="${H * .7}" rx="${H * .3}" ${k}/>
        <rect x="${W * .05 + body}" y="${H * .43}" width="${rod}" height="${H * .14}" ${k}/>
        <circle cx="${W * .05 + body + rod + 5}" cy="${H * .5}" r="5" ${k}/>
        <rect x="${W * .2}" y="0" width="${W * .12}" height="${H * .15}" ${k}/>${led(W * .4, H * .5)}`;
    }
    case "supply":
      return `<line x1="${W / 2}" y1="${H * .55}" x2="${W / 2}" y2="${H}" stroke="#000" stroke-width="1.4"/>
        <line x1="${W * .2}" y1="${H * .3}" x2="${W * .8}" y2="${H * .3}" stroke="#000" stroke-width="2"/>
        <line x1="${W * .34}" y1="${H * .42}" x2="${W * .66}" y2="${H * .42}" stroke="#000" stroke-width="4"/>
        <line x1="${W / 2}" y1="0" x2="${W / 2}" y2="${H * .3}" stroke="#000" stroke-width="1.4"/>
        <rect x="${W / 2 - 5}" y="${H * .58}" width="10" height="${H * .18}" ${k}/>`;
    default:
      return `<rect x="${W * .08}" y="0" width="${W * .84}" height="${H}" rx="3" ${k}/>
        <rect x="0" y="${H * .15}" width="${W * .1}" height="${H * .2}" ${k}/><rect x="${W * .9}" y="${H * .15}" width="${W * .1}" height="${H * .2}" ${k}/>
        <circle cx="${W * .05}" cy="${H * .25}" r="2" ${k}/><circle cx="${W * .95}" cy="${H * .25}" r="2" ${k}/>
        ${[.3, .45, .6, .75].map(f => `<rect x="${W * f - 3}" y="${H - 7}" width="6" height="7" ${k}/>`).join("")}
        <line x1="${W * .2}" y1="${H * .55}" x2="${W * .8}" y2="${H * .55}" stroke="#000" stroke-width=".7"/>${led(W * .85, H * .12)}`;
  }
}

const DISPLAY_SHOWS = [
  ["Boat speed", () => { const v = pick("stw", 128259, v => v.speedWaterReferenced != null).p?.v.speedWaterReferenced; return v == null ? "--" : fix(v * KN, 1); }],
  ["AWA", () => { const w = busWind(); return w.awa == null ? "--" : fix(Math.abs(w.awa), 0) + "°"; }],
  ["Heading", () => { const h = busHeadingTrue(); return h.deg == null ? "--" : fix(h.deg, 0) + "°"; }],
  ["Depth", () => { const p = pick("depth", 128267).p?.v; return p?.depth == null ? "--" : fix(p.depth + (p.offset || 0), 1); }],
  ["TWS", () => { const w = busWind(); return w.tws == null ? "--" : fix(w.tws, 1); }],
];

function wrapText(s, maxPx, size) {
  const maxC = Math.max(6, Math.floor(maxPx / (size * .56)));
  const words = String(s).split(/\s+/), lines = [];
  let cur = "";
  for (const w of words) {
    if ((cur + " " + w).trim().length <= maxC) cur = (cur + " " + w).trim();
    else { if (cur) lines.push(cur); cur = w.length > maxC ? w.slice(0, maxC - 1) + "…" : w; }
    if (lines.length === 2) break;
  }
  if (lines.length < 2 && cur) lines.push(cur);
  if (lines.length === 2 && lines.join(" ").length < String(s).length && !lines[1].endsWith("…")) lines[1] = lines[1].slice(0, maxC - 1) + "…";
  return lines.slice(0, 2);
}

/* Connector slots: a tee every half metre (every metre on long backbones),
   free unless another device or the power tee has it. */
function slotStep() { return S.backbone.length_m > 30 ? 1 : 0.5; }
function freeSlots(exceptId) {
  const L = S.backbone.length_m, st = slotStep(), out = [];
  const taken = S.devices.filter(d => d.cfg.id !== exceptId).map(d => d.cfg.tee_m);
  if (exceptId !== "__power") taken.push(S.backbone.power_tap_m);
  for (let m = st; m < L - 1e-6; m += st) {
    const r = Math.round(m * 100) / 100;
    if (!taken.some(t => Math.abs(t - r) < st / 2 - 1e-6)) out.push(r);
  }
  return out;
}

function layout(W) {
  const bb = S.backbone, L = Math.max(bb.length_m, 1);
  const x0 = 56, x1 = W - 56, sx = (x1 - x0) / L;
  const items = S.devices.map(d => {
    const look = lookOf(d);
    let tee = d.cfg.tee_m;
    if (drag && drag.id === d.cfg.id && drag.slot != null) tee = drag.slot;
    return { d, look, tee, tx: x0 + Math.min(Math.max(tee, 0), L) * sx, side: ABOVE.has(look.form) ? "above" : "below" };
  });
  let ptee = bb.power_tap_m;
  if (drag && drag.id === "__power" && drag.slot != null) ptee = drag.slot;
  items.push({ power: true, look: { form: "supply", w: 60, h: 70 }, tee: ptee, tx: x0 + Math.min(Math.max(ptee, 0), L) * sx, side: "above" });
  const gap = 14, plateW = 112, plateH = 48;
  let s = 0.8;
  const size = it => {
    const dw = Math.min(it.look.w, MAX_W) * s, dh = Math.min(it.look.h, MAX_H) * s;
    it.dw = it.power ? 34 : Math.max(dw, 12); it.dh = it.power ? 40 : Math.max(dh, 10);
    it.w = it.power ? 70 : Math.max(it.dw, plateW); it.h = it.dh + (it.power ? 0 : plateH);
  };
  const fits = () => ["above", "below"].every(side => {
    const g = items.filter(i => i.side === side);
    return g.reduce((a, i) => a + i.w, 0) + gap * (g.length - 1) <= W - 16;
  });
  for (; ; s *= 0.9) { items.forEach(size); if (fits() || s < 0.3) break; }
  const groups = {};
  for (const side of ["above", "below"]) {
    const g = items.filter(i => i.side === side).sort((a, b) => a.tx - b.tx);
    let x = 8;
    for (const it of g) { it.x = Math.max(it.tx - it.w / 2, x); x = it.x + it.w + gap; }
    let right = W - 8;
    for (let i = g.length - 1; i >= 0; i--) { const it = g[i]; if (it.x + it.w > right) it.x = right - it.w; right = it.x - gap; }
    // Jog levels so the horizontal runs of drop cables never overlap.
    const ends = [];
    for (const it of g.slice().sort((a, b) => Math.min(a.tx, a.x + a.w / 2) - Math.min(b.tx, b.x + b.w / 2))) {
      const lo = Math.min(it.tx, it.x + it.w / 2), hi = Math.max(it.tx, it.x + it.w / 2);
      if (hi - lo < 1) { it.level = 0; continue; }
      let lv = ends.findIndex(e => e < lo - 6);
      if (lv < 0) { lv = ends.length; ends.push(0); }
      ends[lv] = hi; it.level = lv;
    }
    groups[side] = { g, levels: ends.length };
  }
  const jogA = 20 + groups.above.levels * 7, jogB = 20 + groups.below.levels * 7;
  const maxA = Math.max(0, ...groups.above.g.map(i => i.h)), maxB = Math.max(0, ...groups.below.g.map(i => i.h));
  const busY = 24 + maxA + jogA;
  for (const it of groups.above.g) { it.y = busY - jogA - it.h; it.jogY = busY - 14 - it.level * 7; }
  for (const it of groups.below.g) { it.y = busY + jogB; it.jogY = busY + 14 + it.level * 7; }
  const dimY = busY + jogB + maxB + 34;
  return { above: groups.above.g, below: groups.below.g, x0, x1, sx, s, busY, dimY, H: dimY + 96 };
}

function initDrag() {
  const svg = $("#sheet-svg");
  const metresAt = clientX => {
    const r = svg.getBoundingClientRect(), L = S.backbone.length_m, x0 = 56, x1 = Math.max(r.width, 640) - 56;
    return Math.min(Math.max((clientX - r.left - x0) / ((x1 - x0) / L), 0), L);
  };
  svg.addEventListener("pointerdown", e => {
    const g = e.target.closest("[data-id]"); if (!g) return;
    drag = { id: g.dataset.id, x: e.clientX, moved: false, slot: null };
    try { svg.setPointerCapture(e.pointerId); } catch (_) { }
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) > 4) drag.moved = true;
    if (!drag.moved) return;
    const m = metresAt(e.clientX), slots = freeSlots(drag.id);
    drag.slot = slots.length ? slots.reduce((b, sl) => Math.abs(sl - m) < Math.abs(b - m) ? sl : b, slots[0]) : null;
    renderSchematic();
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved) { if (d.id !== "__power") { UI.device = UI.device === d.id ? null : d.id; render(); } return; }
    if (d.slot == null) { render(); return; }
    if (d.id === "__power") api("/api/backbone", { power_tap_m: d.slot });
    else api("/api/device", { id: d.id, patch: { tee_m: d.slot } });
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", () => { drag = null; render(); });
  svg.addEventListener("click", e => {
    const t = e.target.closest(".term"); if (!t) return;
    api("/api/backbone", { [t.dataset.k]: !S.backbone[t.dataset.k] });
  });
  svg.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const t = e.target.closest(".term");
    if (t) { e.preventDefault(); api("/api/backbone", { [t.dataset.k]: !S.backbone[t.dataset.k] }); return; }
    const g = e.target.closest("[data-id]"); if (!g || g.dataset.id === "__power") return;
    e.preventDefault(); UI.device = g.dataset.id; render();
  });
}

function renderSchematic() {
  const svg = $("#sheet-svg"); if (!svg) return;
  // At least 640 px wide; narrower screens scroll the drawing sideways, so
  // the drawing and the pulse layer are always the same pixel size.
  const W = Math.max(svg.parentElement.clientWidth || 1000, 640);
  const bb = S.backbone, L = bb.length_m;
  const lay = layout(W);
  const { x0, x1, sx, busY, dimY, H } = lay;
  const all = [...lay.above, ...lay.below];
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const cableW = bb.cable === "micro" ? 6 : bb.cable === "mid" ? 8 : 10;
  let h = `<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#000" stroke-width="1.2"/></pattern></defs>`;

  // Drop cables first, so drawings sit on top of them.
  for (const it of all) {
    const cx = it.x + it.w / 2, end = it.side === "above" ? it.y + it.h : it.y;
    const off = it.d && !it.d.cfg.enabled, long = it.d && it.d.cfg.drop_m > 6;
    h += `<path d="M${it.tx} ${busY} V${it.jogY} H${cx} V${end}" fill="none" stroke="#000" stroke-width="${it.power ? 2 : 1.6}" ${off ? 'stroke-dasharray="1 4"' : long ? 'stroke-dasharray="6 3"' : ""}/>`;
  }
  // Backbone: a hollow cable with data pulses inside.
  h += `<line x1="${x0}" y1="${busY}" x2="${x1}" y2="${busY}" stroke="#000" stroke-width="${cableW}"/>
        <line x1="${x0}" y1="${busY}" x2="${x1}" y2="${busY}" stroke="#fff" stroke-width="${cableW - 3}"/>`;
  if (!bb.powered) h += `<line x1="${x0}" y1="${busY}" x2="${x1}" y2="${busY}" stroke="url(#hatch)" stroke-width="${cableW - 3}"/>`;
  for (const it of all) h += `<rect x="${it.tx - 5}" y="${busY - cableW / 2 - 3}" width="10" height="${cableW + 6}" fill="#fff" stroke="#000" stroke-width="1.3"/>`;
  if (drag && drag.moved) {
    for (const sl of freeSlots(drag.id)) {
      const x = x0 + sl * sx, on = sl === drag.slot;
      h += `<circle cx="${x}" cy="${busY}" r="${on ? 5 : 2.5}" fill="${on ? "#000" : "#fff"}" stroke="#000"/>`;
    }
  }
  // Terminators: a solid plug when fitted, a hatched open end when missing.
  for (const [k, x, dir] of [["term_start", x0, -1], ["term_end", x1, 1]]) {
    const on = bb[k], bx = dir < 0 ? x - 26 : x;
    h += `<g class="term" data-k="${k}" tabindex="0" role="button" aria-label="${on ? "Remove" : "Fit"} the terminator at ${k === "term_start" ? "0 m" : L + " m"}">
      <title>${on ? "120 Ω terminator. Click to remove." : "No terminator. Click to fit one."}</title>
      <rect x="${bx}" y="${busY - 11}" width="26" height="22" rx="4" fill="${on ? "#000" : "#fff"}" stroke="#000" stroke-width="1.5" ${on ? "" : 'stroke-dasharray="3 2"'}/>
      <text x="${bx + 13}" y="${busY + 3.5}" font-size="8.5" text-anchor="middle" class="din" style="fill:${on ? "#fff" : "#000"}">${on ? "120Ω" : "open"}</text></g>`;
  }
  // Devices.
  for (const it of all) {
    const above = it.side === "above";
    const cx = it.x + it.w / 2, dx = cx - it.dw / 2;
    const dy = above ? it.y + (it.h - it.dh) : it.y;
    if (it.power) {
      h += `<g data-id="__power" class="dev" tabindex="0" role="button" aria-label="Power tee at ${fix(it.tee, 1)} m"><title>Power tee: drag along the backbone</title>
        <rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" fill="transparent"/>
        <g transform="translate(${dx},${dy})">${drawForm(it.look, it.dw, it.dh, {}, null)}</g>
        <text x="${cx + it.dw / 2 + 2}" y="${dy + it.dh * .4}" font-size="13" class="din">${bb.powered ? fix(bb.supply_v, 1) + " V" : "off"}</text></g>`;
      continue;
    }
    const d = it.d, c = d.cfg;
    const first = c.pgns.find(p => p.enabled);
    const live = { on: c.enabled && S.t - (UI.active.get(d.address) ?? -9) < 0.3, col: first ? CATCOL[pgnCat(first.pgn)] : "#000" };
    if (it.look.form === "display") {
      const idx = S.devices.filter(x => lookOf(x).form === "display").indexOf(d);
      const [lab, fn] = DISPLAY_SHOWS[idx % DISPLAY_SHOWS.length];
      const on = d.state === "online" && c.enabled;
      live.screenLabel = on ? lab : ""; live.screenValue = on ? fn() : "";
    }
    if (it.look.form === "ram") live.rudder = S.truth.rudder;
    if (it.look.form === "arm") { const st = S.pgns.find(x => x.src === d.address && x.pgn === 127245); live.rudder = st?.v.position != null ? st.v.position * DEG : 0; }
    const bad = c.enabled && FAULTED.has(d.state);
    const faults = Object.entries(c.faults).filter(([k, v]) => (typeof v === "boolean" && v) || (k === "noise_mult" || k === "rate_mult" ? v !== 1 : typeof v === "number" && v !== 0)).length;
    const state = !c.enabled ? "unplugged" : STATE_TXT[d.state];
    const reading = c.enabled && d.state === "online" ? readingFor(d) : "";
    const addr = d.state === "cannot_claim" ? "254" : String(d.address);
    const lines = wrapText(c.label + (faults ? " △" : ""), it.w - 4, 12);
    const py = above ? it.y + 11 : it.y + it.dh + 15;
    let plate = lines.map((ln, i) => `<text x="${cx}" y="${py + i * 13}" font-size="12" font-weight="600" text-anchor="middle">${esc(ln)}</text>`).join("");
    const y2 = py + lines.length * 13;
    plate += `<text x="${cx}" y="${y2}" font-size="11" text-anchor="middle" class="din">${esc(addr)}<tspan dx="8">${fix(d.voltage, 1)} V</tspan>${reading ? `<tspan dx="8">${esc(reading)}</tspan>` : ""}</text>`;
    if (state) plate += `<rect x="${cx - state.length * 3.3 - 5}" y="${y2 + 4}" width="${state.length * 6.6 + 10}" height="14" rx="2" fill="${state === "claiming" || state === "unplugged" && !c.enabled ? "#fff" : "#ff5a1f"}" stroke="#000"/><text x="${cx}" y="${y2 + 15}" font-size="11" text-anchor="middle">${esc(state)}</text>`;
    const sel = UI.device === c.id;
    h += `<g data-id="${esc(c.id)}" class="dev" tabindex="0" role="button" aria-label="${esc(c.label)}, address ${esc(addr)}${state ? ", " + esc(state) : ""}" opacity="${c.enabled ? 1 : .4}">
      <title>${esc(c.label)}${it.look.sourced ? "" : ". Generic shape, illustrative size"}${faults ? ". Has fault settings" : ""}. Drag to move its tee.</title>
      <rect x="${it.x - 4}" y="${it.y - 4}" width="${it.w + 8}" height="${it.h + 8}" fill="transparent" stroke="${sel ? "#000" : "none"}" stroke-dasharray="5 3"/>
      <g transform="translate(${dx},${dy})">${drawForm(it.look, it.dw, it.dh, live, d)}${bad ? `<rect x="0" y="0" width="${it.dw}" height="${it.dh}" fill="url(#hatch)" opacity=".6"/>` : ""}</g>
      <rect x="${cx - 4}" y="${above ? dy + it.dh - 1 : dy - 6}" width="8" height="7" rx="2" fill="#000"/>
      ${plate}</g>`;
  }
  // Dimension line, to the backbone's scale.
  const step = L > 60 ? 10 : L > 25 ? 5 : L > 10 ? 2 : 1;
  h += `<line x1="${x0}" y1="${dimY}" x2="${x1}" y2="${dimY}" stroke="#000"/>
        <line x1="${x0}" y1="${busY + 14}" x2="${x0}" y2="${dimY - 6}" stroke="#000" stroke-width=".5" stroke-dasharray="2 3"/>
        <line x1="${x1}" y1="${busY + 14}" x2="${x1}" y2="${dimY - 6}" stroke="#000" stroke-width=".5" stroke-dasharray="2 3"/>
        <text x="${x1 + 8}" y="${dimY + 4}" font-size="11" class="din">m</text>`;
  for (let m = 0; m <= L + 1e-6; m += step) {
    const x = x0 + m * sx;
    h += `<line x1="${x}" y1="${dimY - 4}" x2="${x}" y2="${dimY + 4}" stroke="#000"/><text x="${x}" y="${dimY + 16}" font-size="11" text-anchor="middle" class="din">${m}</text>`;
  }
  // Title block.
  const on = S.devices.filter(d => d.cfg.enabled);
  const amps = on.reduce((a, d) => a + d.cfg.len * 0.05, 0), lens = on.reduce((a, d) => a + d.cfg.len, 0);
  const pxPerMm = 96 / 25.4, ratio = Math.max(1, Math.round(pxPerMm / lay.s));
  const tbW = Math.min(560, W - 20), tbX = W - tbW - 10, tbY = dimY + 30, cw = tbW / 4;
  const cell = (i, top, val) => `<text x="${tbX + cw * i + 7}" y="${tbY + 13}" font-size="9" style="fill:#767676">${top}</text><text x="${tbX + cw * i + 7}" y="${tbY + 33}" font-size="15" class="din">${esc(val)}</text>`;
  const barPx = 100 * lay.s;
  h += `<rect x="${tbX}" y="${tbY}" width="${tbW}" height="46" fill="#fff" stroke="#000" stroke-width="1.5"/>
    ${[1, 2, 3].map(i => `<line x1="${tbX + cw * i}" y1="${tbY}" x2="${tbX + cw * i}" y2="${tbY + 46}" stroke="#000"/>`).join("")}
    ${cell(0, "Network", S.network_name || "Untitled")}${cell(1, "Backbone", `${L} m ${bb.cable}`)}${cell(2, "Load", `${fix(amps, 2)} A, ${lens} LEN`)}${cell(3, "Devices drawn at", `1:${ratio}`)}
    <line x1="${tbX + cw * 4 - barPx - 8}" y1="${tbY + 30}" x2="${tbX + cw * 4 - 8}" y2="${tbY + 30}" stroke="#000" stroke-width="3"/>
    <text x="${tbX + cw * 4 - 8}" y="${tbY + 42}" font-size="8" text-anchor="end" style="fill:#767676">100 mm</text>`;
  svg.innerHTML = h;
  $("#sheettitle").textContent = S.network_name || "Network";
  const ov = $("#pulse-svg");
  ov.setAttribute("width", W); ov.setAttribute("height", H); ov.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const tx = new Map();
  for (const it of all) if (it.d && it.d.cfg.enabled) tx.set(it.d.address, it.tx);
  const gw = all.find(it => it.d && it.d.cfg.kind === "gateway");
  GEO = { x0, x1, busY, tx, gw: gw ? gw.tx : x0, powered: bb.powered };
}

/* A calm picture of who is talking: each device sends at most one pulse
   every 1.2 s, in the colour of the data it mostly sends, drifting a short
   way along the cable and fading. Error frames flash orange at their
   source, at most one flash every 0.6 s. */
let GEO = null;
const PULSE_EVERY = 1200, PULSE_PX = 140, PULSE_MS = 1600, ERROR_EVERY = 600;
const lastPulse = new Map();
let lastError = 0;
function spawnPulses(frames) {
  if (RM.matches || UI.tab !== "network" || !GEO || !GEO.powered || drag || !frames.length) return;
  const ov = $("#pulse-svg"); if (!ov) return;
  const ns = "http://www.w3.org/2000/svg", now = performance.now();
  const bySrc = new Map();
  let errorAt = null;
  for (const f of frames) {
    const c = decodeId(parseInt(f[2], 16));
    const x = (f[4] & 2) ? GEO.gw : GEO.tx.get(c.src) ?? GEO.x0;
    if (f[4] & 1) { errorAt = x; continue; }
    const cat = pgnCat(c.pgn);
    if (cat === "mgmt") continue;
    const e = bySrc.get(c.src) || { x, counts: {} };
    e.counts[cat] = (e.counts[cat] || 0) + 1;
    bySrc.set(c.src, e);
  }
  if (errorAt != null && now - lastError >= ERROR_EVERY) {
    lastError = now;
    const el = document.createElementNS(ns, "rect");
    el.setAttribute("x", errorAt - 5); el.setAttribute("y", GEO.busY - 5); el.setAttribute("width", 10); el.setAttribute("height", 10);
    el.setAttribute("fill", "#ff5a1f"); el.setAttribute("stroke", "#000");
    el.style.transformBox = "fill-box"; el.style.transformOrigin = "center";
    ov.appendChild(el);
    el.animate([{ transform: "scale(.6) rotate(0deg)", opacity: 1 }, { transform: "scale(2) rotate(45deg)", opacity: 0 }], { duration: 900, easing: "ease-out", fill: "both" }).onfinish = () => el.remove();
  }
  for (const [src, e] of bySrc) {
    if (now - (lastPulse.get(src) ?? -1e9) < PULSE_EVERY) continue;
    lastPulse.set(src, now);
    const cat = Object.entries(e.counts).sort((a, b) => b[1] - a[1])[0][0];
    for (const end of [GEO.x0, GEO.x1]) {
      const room = end - e.x;
      if (Math.abs(room) < 6) continue;
      const dist = Math.sign(room) * Math.min(Math.abs(room), PULSE_PX);
      const el = document.createElementNS(ns, "circle");
      el.setAttribute("cx", e.x); el.setAttribute("cy", GEO.busY); el.setAttribute("r", 3);
      el.setAttribute("fill", CATCOL[cat]); el.setAttribute("stroke", "#000"); el.setAttribute("stroke-width", .8);
      ov.appendChild(el);
      el.animate([{ transform: "translateX(0)", opacity: 1 }, { transform: `translateX(${dist}px)`, opacity: 0 }], { duration: PULSE_MS, easing: "cubic-bezier(.2,.6,.3,1)", fill: "both" }).onfinish = () => el.remove();
    }
  }
}

function dial(size, a1, a2, labels) {
  const r = size / 2 - 4, c = size / 2;
  let ticks = "";
  for (let a = 0; a < 360; a += 10) {
    const big = a % 30 === 0, rr = big ? r - 10 : r - 6, t = (a - 90) / DEG;
    ticks += `<line x1="${c + Math.cos(t) * rr}" y1="${c + Math.sin(t) * rr}" x2="${c + Math.cos(t) * (r - 2)}" y2="${c + Math.sin(t) * (r - 2)}" stroke="#000" stroke-width="${big ? 1.6 : .8}"/>`;
  }
  const lab = labels.map(([a, s]) => { const t = (a - 90) / DEG; return `<text x="${c + Math.cos(t) * (r - 21)}" y="${c + Math.sin(t) * (r - 21) + 4}" font-size="11" text-anchor="middle" font-family="DIN Alternate, Arial Narrow">${s}</text>`; }).join("");
  const needle = (a, hollow) => { if (a == null) return ""; const t = (a - 90) / DEG, len = hollow ? r - 18 : r - 8; return `<path d="M${c + Math.cos(t + 1.57) * 3} ${c + Math.sin(t + 1.57) * 3} L${c + Math.cos(t) * len} ${c + Math.sin(t) * len} L${c + Math.cos(t - 1.57) * 3} ${c + Math.sin(t - 1.57) * 3} Z" fill="${hollow ? "#fff" : "#000"}" stroke="#000" stroke-width="1.2"/>`; };
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${c}" cy="${c}" r="${r}" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="${c}" cy="${c}" r="${r - 4}" fill="none" stroke="#000" stroke-width=".6"/>${ticks}${lab}${needle(a2, true)}${needle(a1, false)}<circle cx="${c}" cy="${c}" r="4" fill="#000"/></svg>`;
}

function renderTrack() {
  const svg = $("#track"); if (!svg) return;
  const W = svg.getBoundingClientRect().width || 500, H = 320;
  const showTruth = $("#showtruth").checked;

function chart(cv, series, max, fmt) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;

  g.font = `${10 * dpr}px "DIN Alternate", "Arial Narrow", sans-serif`; g.fillStyle = "#767676";
  for (const f of [0, .5, 1]) { const y = H - 4 * dpr - f * (H - 14 * dpr); g.strokeStyle = "#dadada"; g.lineWidth = 1; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.fillText(fmt(f * max), 3 * dpr, y - 2 * dpr); }

    if (pts.length < 2) continue;
    g.strokeStyle = "#000"; g.lineWidth = 1.6 * dpr; g.setLineDash(dash ? [4 * dpr, 3 * dpr] : []); g.beginPath();
    pts.forEach((v, i) => { const x = i / 119 * W, y = H - 4 * dpr - Math.min(v / max, 1) * (H - 14 * dpr); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  }
  g.setLineDash([]);
}

function renderLog(force) {
  if (UI.logPaused && !force) return;
  const f = UI.filter, srcf = f.startsWith("src:") ? +f.slice(4) : null, out = [];

      const [, t, id, data, flags] = FRAMES[i];

      if (UI.cats && !UI.cats.has(pgnCat(c.pgn))) continue;
      if (f && (srcf != null ? c.src !== srcf : !(String(c.pgn).includes(f) || id.toLowerCase().includes(f) || data.toLowerCase().includes(f) || pgnName(c.pgn).toLowerCase().includes(f)))) continue;

      out.push(`<tr class="click ${flags & 1 ? "err" : ""}" data-f="${i}"><td class="${cls}">${fix(t, 3)}</td><td>${esc(id)}</td><td>${c.prio}</td><td>${sw(c.pgn)}${c.pgn}</td><td>${c.src}→${c.dst === 255 ? "all" : c.dst}</td><td class="txt" style="font-family:var(--mono);font-size:12px">${esc(data)}${flags & 1 ? "  error" : ""}</td></tr>`);
    }
  } else {

      const [, t, pgn, src, dst, , text] = MSGS[i];

      if (UI.cats && !UI.cats.has(pgnCat(pgn))) continue;
      if (f && (srcf != null ? src !== srcf : !(String(pgn).includes(f) || text.toLowerCase().includes(f) || pgnName(pgn).toLowerCase().includes(f)))) continue;
      out.push(`<tr class="click" data-m="${i}"><td>${fix(t, 3)}</td><td>${sw(pgn)}${pgn}</td><td>${src}→${dst === 255 ? "all" : dst}</td><td class="txt" title="${esc(text)}"><b>${esc(pgnName(pgn))}</b> ${esc(text)}</td></tr>`);
    }
  }
  $("#log").innerHTML = (UI.logMode === "frames" ? `<tr><th>Time s</th><th>CAN id</th><th>P</th><th>PGN</th><th>From, to</th><th>Data</th></tr>` : `<tr><th>Time s</th><th>PGN</th><th>From, to</th><th>Decoded</th></tr>`) + out.join("");
  $$("#log tr.click").forEach(tr => tr.onclick = () => {
    if (tr.dataset.f) {

      $("#logdetail").textContent = `CAN id ${id}: priority ${c.prio}, PGN ${c.pgn} (${pgnName(c.pgn)}), source ${c.src}, destination ${c.dst === 255 ? "everyone" : c.dst}\n` +
        `${((n >>> 16) & 0xff) < 240 ? "PDU1, addressed: the PS byte is the destination." : "PDU2, broadcast: the PS byte is part of the PGN."}\nData ${data}${flags & 1 ? "\nDestroyed by a bus error; the sender retransmits it." : ""}${how}`;
    } else {
      const [, t, pgn, src, dst, prio, text] = MSGS[+tr.dataset.m];
      $("#logdetail").textContent = `${pgn} ${pgnName(pgn)}\nFrom ${srcLabel(src)} to ${dst === 255 ? "everyone" : dst}, priority ${prio}, at ${fix(t, 3)} s\n\n${text.split(/ (?=\w+=)/).join("\n")}`;
    }
  });
}

/* ---------- sailing ---------- */
function buildSailing() {
  const f = (k, l, step) => `<label class="f">${l}<input type="number" step="${step}" data-env="${k}"></label>`;
  $("#v-sailing").innerHTML = `
    <div class="row" style="margin-bottom:16px" id="presets"></div>
    <div class="cols">
      <section class="sheet"><h2>Steering</h2><div class="body">
        <span class="seg" id="helmmode"><button data-m="manual">Manual tiller</button><button data-m="hold">Hold course</button><button data-m="external">Autopilot</button></span>
        <div class="row" style="margin-top:14px">
          <label class="f">Course °T<input type="number" step="1" data-helm="course_deg"></label>
          <button class="btn small" data-turn="-10">−10</button><button class="btn small" data-turn="-1">−1</button><button class="btn small" data-turn="1">+1</button><button class="btn small" data-turn="10">+10</button>
          <label class="f">Order timeout s<input type="number" step="0.1" min="0.1" data-helm="order_timeout_s"></label>
        </div>
        <label class="f" style="margin-top:14px;display:flex">Manual rudder <span class="din" id="rudtxt" style="color:#000;font-size:15px"></span><input type="range" min="-30" max="30" step="0.5" data-helm="rudder_deg" style="width:100%"></label>
        <p style="margin:12px 0 0" id="helmnote"></p></div></section>
      <section class="sheet"><h2>What is really happening<span class="grow"></span><button class="btn small" id="resetboat">Reset boat</button></h2><table id="truth"></table></section>
    </div>
    <div class="cols">
      <section class="sheet"><h2>Wind and sea</h2><div class="body">
        <div class="row">${f("tws_kn", "Wind kn", 0.5)}${f("twd_deg", "From °T", 5)}${f("gust_pct", "Gusts %", 1)}${f("shift_deg", "Shifts °", 1)}</div>
        <div class="row" style="margin-top:10px">${f("wave_height_m", "Waves m", 0.1)}${f("wave_period_s", "Period s", 0.5)}${f("wave_dir_deg", "From °T", 5)}</div>
        <div class="row" style="margin-top:10px">${f("current_kn", "Stream kn", 0.1)}${f("current_set_deg", "Setting °T", 5)}</div></div></section>
      <section class="sheet"><h2>Seabed and air</h2><div class="body">
        <div class="row">${f("depth_m", "Depth at start m", 0.5)}${f("shoal_m_per_km", "Shoals m/km", 0.5)}${f("shoal_dir_deg", "Towards °T", 5)}</div>
        <div class="row" style="margin-top:10px">${f("variation_deg", "Variation °, east +", 0.1)}${f("water_temp_c", "Sea °C", 0.1)}${f("air_temp_c", "Air °C", 0.1)}${f("pressure_hpa", "Pressure hPa", 1)}</div>
        <div class="row" style="margin-top:10px">${f("seed", "Seed, on reset", 1)}</div></div></section>
    </div>
    <section class="sheet"><h2>Connecting the autopilot</h2><div class="body">
      <p style="margin:0 0 6px;max-width:80ch">The simulator listens like a Yacht Devices gateway set to RAW, at <code id="gwaddr"></code>. Every frame arrives as a line; send one by writing its identifier and bytes. With steering on Autopilot, the simulated rudder drive follows the angle order in PGN 127245.</p>
      <pre class="help" id="gwhelp"></pre>
      <p style="margin:6px 0 0">A working client is in <code>crates/n2k/examples/ydraw_pilot.rs</code>.</p></div></section>`;
  $("#presets").innerHTML = META.presets.map(p => `<button class="btn" data-preset="${esc(p.key)}">${esc(p.title)}</button>`).join("");
  $$("[data-preset]").forEach(b => b.onclick = () => api("/api/preset", { key: b.dataset.preset }));
  $$("[data-env]").forEach(inp => inp.onchange = () => api("/api/world", { env: { [inp.dataset.env]: readInput(inp) } }));
  $$("[data-helm]").forEach(inp => { inp.onchange = () => api("/api/world", { helm: { [inp.dataset.helm]: readInput(inp) } }); if (inp.type === "range") inp.oninput = inp.onchange; });
  $$("#helmmode button").forEach(b => b.onclick = () => api("/api/world", { helm: { mode: b.dataset.m } }));
  $$("[data-turn]").forEach(b => b.onclick = () => api("/api/world", { helm: { course_deg: wrap360(S.helm.course_deg + +b.dataset.turn) } }));
  $("#resetboat").onclick = () => { UI.track = []; UI.truthTrack = []; api("/api/control", { action: "reset_world" }); };
}
function renderSailing() {
  $$("[data-env]").forEach(inp => syncInput(inp, S.env[inp.dataset.env]));
  $$("[data-helm]").forEach(inp => syncInput(inp, S.helm[inp.dataset.helm]));
  $("#rudtxt").textContent = fix(S.helm.rudder_deg, 1) + "°";
  $$("#helmmode button").forEach(b => b.classList.toggle("on", b.dataset.m === S.helm.mode));
  const t = S.truth;
  $("#helmnote").textContent = S.helm.mode === "external"
    ? (t.external_timed_out ? `No angle order for over ${S.helm.order_timeout_s} s, so the drive is holding ${fix(t.rudder_order, 1)}°. ${S.gateway.clients} gateway client${S.gateway.clients === 1 ? "" : "s"} connected.` : `Following angle orders: ${fix(t.rudder_order, 1)}°.`)
    : S.helm.mode === "hold" ? "A simple built-in helmsman holds the course, so the boat keeps sailing while nothing else steers." : "The rudder stays where you put it.";
  const rows = [
    ["Heading", fix(t.heading, 1) + "°T"], ["Boat speed", fix(t.bsp, 2) + " kn"], ["Over ground", `${fix(t.sog, 2)} kn at ${fix(t.cog, 0)}°T`],
    ["True wind", `${fix(t.tws, 1)} kn from ${fix(t.twd, 0)}°T, angle ${fix(t.twa, 0)}°`], ["Apparent wind", `${fix(t.aws, 1)} kn at ${fix(t.awa, 0)}°`],
    ["Heel, pitch", `${fix(t.heel, 1)}°, ${fix(t.pitch, 1)}°`], ["Leeway", fix(t.leeway, 1) + "°"], ["Rudder, order", `${fix(t.rudder, 1)}°, ${fix(t.rudder_order, 1)}°`],
    ["Depth", fix(t.depth, 1) + " m"], ["Ram current", fix(t.ram_current, 2) + " A"], ["Sailed", fix(t.log_nm, 2) + " nm"], ["Position", `${fmtLat(t.lat)} ${fmtLon(t.lon)}`],
  ];
  $("#truth").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td class="n">${v}</td></tr>`).join("");
  if (S.gateway.addr === "off") {
    $("#gwaddr").textContent = META.hosted ? "a local copy (this hosted demo has no gateway)" : "nothing, because the gateway is off";
    $("#gwhelp").textContent = "cargo run --release -p n2ksim\n# then connect to tcp://127.0.0.1:1457";
    return;
  }
  const [host, port] = S.gateway.addr.split(":");
  $("#gwaddr").textContent = "tcp://" + S.gateway.addr;
  $("#gwhelp").textContent = `nc ${host} ${port}\n# lines arrive like:\n10:00:01.234 R 09FD0205 03 4C 06 1B 21 FA FF FF\n# send a rudder angle order of +5° (0.0873 rad = 873 = 0x0369) from address 50:\n09F10D32 00 F8 69 03 FF 7F FF FF`;
}

/* ---------- header and dispatch ---------- */
function renderHeader() {
  $("#netname").textContent = S.network_name || "Untitled";
  const np = $("#netpreset"), cur = META.networks.find(n => n.title === S.network_name);
  if (np && cur && document.activeElement !== np && np.dataset.synced !== cur.key) { np.value = cur.key; np.dataset.synced = cur.key; }
  $("#clock").textContent = `${fmtUtc(S.utc)}, ${fix(S.t, 0)} s`;
  const pb = $("#pausebtn");
  pb.classList.toggle("on", S.paused); pb.textContent = S.paused ? "Play" : "Pause";
  $$("#speed [data-speed]").forEach(b => b.classList.toggle("on", +b.dataset.speed === S.speed && !S.paused));
  const load = Math.min(1, S.bus.load);
  const needle = $("#meter .needle"); if (needle) needle.style.transform = `rotate(${load * 180}deg)`;
  $("#loadtxt").textContent = (load * 100).toFixed(0) + "%";
  const lh = S.history[S.history.length - 1];
  $("#fps").textContent = lh ? fix(lh[2], 0) : "0";
  $("#eps").textContent = lh ? fix(lh[3], 1) : "0";
  const g = S.gateway;
  $("#gw").innerHTML = g.addr === "off"
    ? `<span class="dot"></span><div><small>Gateway</small><b>${META.hosted ? "run locally to connect" : "off"}</b></div>`
    : `<span class="dot ${g.up ? (g.clients ? "on" : "") : "alarm"}"></span><div><small>Gateway ${esc(g.addr)}</small><b>${g.up ? g.clients + " client" + (g.clients === 1 ? "" : "s") : "off the bus"}</b></div>`;
  const r = S.replay;
  $("#replaycell").style.display = r ? "" : "none";
  if (r) $("#replay").textContent = `${r.name}, ${Math.round(r.done / r.total * 100)}%`;
}
function setTab(t) {
  UI.tab = t;
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $$(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + t));
  render();
}
$$("#tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.("input, select, textarea")) return;
  const tabs = ["network", "instruments", "traffic", "sailing"];
  if (e.key >= "1" && e.key <= "4") setTab(tabs[+e.key - 1]);
  else if (e.key === "t" || e.key === "T") setTest(!$("#test").classList.contains("open"));
  else if ((e.key === "p" || e.key === "P") && S) api("/api/control", { action: S.paused ? "resume" : "pause" });
});
function render() {
  if (!S || !META.kinds.length) return;
  renderHeader(); renderTest();
  if (UI.tab === "network") { if (!drag) renderSchematic(); renderBackboneForm(); renderInspector(); renderBusTable(); }
  else if (UI.tab === "instruments") renderInstruments();
  else if (UI.tab === "traffic") renderTraffic();
  else if (UI.tab === "sailing") renderSailing();
}
window.addEventListener("resize", render);
connect();
</script>
</body>
</html>
